name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node.js tests
        run: node --test agent/lib/*.test.mjs scripts/lib/*.test.mjs scripts/lib/menu/*.test.mjs scripts/*.test.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build Eve application
        run: npm run build

      - name: Replica smoke (isolated install + mock provider)
        run: npm run replica

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run autograph tests
        run: python3 scripts/autograph/tests/test_autograph.py

      - name: Run security defense tests
        run: python3 agent/skills/security-defense/scripts/test_security.py

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.3"

      - name: Verify userbot dependency lock
        run: |
          uv pip compile services/telegram-userbot/requirements.in \
            --output-file /tmp/userbot-requirements.lock \
            --python-version 3.12 \
            --python-platform x86_64-unknown-linux-gnu \
            --exclude-newer 2026-07-28T00:00:00Z \
            --generate-hashes \
            --custom-compile-command \
              'uv pip compile services/telegram-userbot/requirements.in --output-file services/telegram-userbot/requirements.lock --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --exclude-newer 2026-07-28T00:00:00Z --generate-hashes'
          diff -u services/telegram-userbot/requirements.lock /tmp/userbot-requirements.lock

      - name: Run userbot guardrail tests
        run: |
          uv venv .venv-userbot
          uv pip sync --python .venv-userbot/bin/python \
            --require-hashes \
            --strict \
            services/telegram-userbot/requirements.lock
          .venv-userbot/bin/python services/telegram-userbot/test_guardrails.py
          .venv-userbot/bin/python services/telegram-userbot/test_health.py
          .venv-userbot/bin/python -m py_compile \
            services/telegram-userbot/guardrails.py \
            services/telegram-userbot/onboarding.py \
            services/telegram-userbot/serve.py
